<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetson_pkg Explained</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="ss-css">
*{box-sizing:border-box}
:root{
  --paper:#EBEEF1;--surface:#FFFFFF;--ink:#18202C;--muted:#59636F;--line:#C2CAD4;--grid:#CBD2DB;
  --edge:#7F8B9D;--hover:rgba(24,32,44,.07);--chrome:rgba(235,238,241,.86);--focus:#2457D6;--danger:#C2353B;
  --c-blue:#4453C9;--c-teal:#0E7F73;--c-amber:#B0701A;--c-rose:#AE3C76;--c-violet:#7445C4;--c-slate:#5D6B80;--c-neutral:#3B4456;
  --in:#13865A;--out:#C9541F;
  --shadow:0 1px 2px rgba(23,32,51,.07),0 10px 28px rgba(23,32,51,.10);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121923;--surface:#1B2431;--ink:#E5EAF1;--muted:#98A4B5;--line:#3A475B;--grid:#253043;
  --edge:#7C899B;--hover:rgba(255,255,255,.08);--chrome:rgba(18,25,35,.84);--focus:#6EA0FF;--danger:#FF7A7F;
  --c-blue:#8E9BF5;--c-teal:#43C3B2;--c-amber:#E4A64C;--c-rose:#E37DB0;--c-violet:#B392F0;--c-slate:#9CA9BC;--c-neutral:#C5CDD9;
  --in:#3DD39A;--out:#FF8A57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.38);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121923;--surface:#1B2431;--ink:#E5EAF1;--muted:#98A4B5;--line:#3A475B;--grid:#253043;
  --edge:#7C899B;--hover:rgba(255,255,255,.08);--chrome:rgba(18,25,35,.84);--focus:#6EA0FF;--danger:#FF7A7F;
  --c-blue:#8E9BF5;--c-teal:#43C3B2;--c-amber:#E4A64C;--c-rose:#E37DB0;--c-violet:#B392F0;--c-slate:#9CA9BC;--c-neutral:#C5CDD9;
  --in:#3DD39A;--out:#FF8A57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.38);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.45 "Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}

/* ---------- canvas ---------- */
.stage{position:absolute;inset:0;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.4px);background-size:22px 22px}
.canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.editing .canvas{cursor:default}
.canvas.panning,.space .canvas{cursor:grabbing}
.canvas text{font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif}
#ss-scene{transition:opacity .4s ease}
#ss-scene.arriving{opacity:0;transition:none}
#ss-scene.leaving{opacity:0;transition:opacity .3s ease}
.zooming .node:not(.target),.zooming .edge,.zooming .group,.zooming .frame{opacity:0;transition:opacity .28s ease}
.zooming .node.target>*:not(.body){opacity:0;transition:opacity .2s}
.zooming .node.target .body .sh{fill:var(--paper);transition:fill .45s ease}

.node{cursor:pointer;outline:none}
.node.has-inner{cursor:zoom-in}
.editing .node{cursor:move}
.node .sh{fill:color-mix(in srgb,var(--nc) 9%,var(--surface));stroke:var(--nc);stroke-width:1.6;stroke-linejoin:round;transition:stroke-width .12s}
.node .sh-top{fill:color-mix(in srgb,var(--nc) 20%,var(--surface));stroke:var(--nc);stroke-width:1.6}
.node .stack .sh,.node .stack .sh-top{fill:var(--surface);stroke-opacity:.45;stroke-width:1.2}
.node .sh-hit{fill:transparent;stroke:none}
.editing .node.t-text .sh-hit{stroke:var(--line);stroke-dasharray:4 4}
.node .ring .sh,.node .ring .sh-top{fill:none;stroke:var(--rc);stroke-width:7;stroke-opacity:.28}
.node .lbl{fill:var(--ink);text-anchor:middle}
.node .ic,.frame .ic{fill:none;stroke:var(--nc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.frame .ic-text{fill:var(--nc);font-weight:700;text-anchor:middle}
.node .ic-text{fill:var(--nc);font-weight:700;text-anchor:middle}
.node .halo{fill:var(--nc);fill-opacity:.12}
.node:hover .body .sh{stroke-width:2.4}
.node:focus-visible .body .sh{stroke:var(--focus);stroke-width:2.8}
.node.sel .body .sh,.node.sel .body .sh-top,.node.sel .body .sh-hit{stroke:var(--focus);stroke-width:2.6;stroke-dasharray:none}
.node .enter{cursor:zoom-in}
.node .enter circle{fill:var(--nc)}
.node .enter path{fill:none;stroke:var(--surface);stroke-width:2;stroke-linecap:round}
.node .role rect{fill:var(--rc)}
.node .role text{fill:var(--surface);font-size:11px;font-weight:700;letter-spacing:.02em}
.node .role path{fill:none;stroke:var(--surface);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node .tag rect{fill:var(--nc)}
.node .tag text{fill:var(--surface);font-size:11px;font-weight:700;text-anchor:middle}
.node .src-dot{fill:var(--nc);opacity:.7}
.port{fill:var(--surface);stroke:var(--focus);stroke-width:1.6;opacity:0;pointer-events:none;transition:opacity .1s}
.editing .node:hover .port,.editing .node.sel .port{opacity:1;pointer-events:all;cursor:crosshair}
.editing .node .port:hover{fill:var(--focus)}
.rs{fill:var(--surface);stroke:var(--focus);stroke-width:1.6;cursor:nwse-resize}

.edge{pointer-events:none}
.editing .edge{pointer-events:auto;cursor:pointer}
.edge .hit{fill:none;stroke:transparent;stroke-width:16}
.edge .line{fill:none;stroke:var(--edge);stroke-width:1.8}
.edge.flow .line{stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
.edge.dashed .line{stroke-dasharray:2 6;stroke-linecap:round}
.edge.sel .line{stroke:var(--focus);stroke-width:2.6}
.edge .elabel rect{fill:var(--paper);stroke:var(--line)}
.edge .elabel text{fill:var(--muted);font-size:12.5px;font-weight:500;text-anchor:middle}
.arrowhead{fill:var(--edge)}
.arrowhead.sel{fill:var(--focus)}
.arrowhead.lit{fill:var(--ink)}
@keyframes flow{to{stroke-dashoffset:-28}}
.tracing .node:not(.lit),.tracing .edge:not(.lit),.tracing .group{opacity:.18;transition:opacity .25s}
.tracing .edge.lit .line{stroke:var(--ink);stroke-width:2.4}
.tracing .node.lit.origin .body .sh{stroke-width:3}

.group .g-body{fill:var(--nc);fill-opacity:.05;stroke:var(--nc);stroke-opacity:.4;stroke-width:1.4;stroke-dasharray:6 5;pointer-events:none}
.group .g-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:none}
.group .g-label{fill:var(--nc);font-size:14px;font-weight:700;pointer-events:none}
.editing .group .g-hit{pointer-events:stroke;cursor:move}
.editing .group .g-label{pointer-events:all;cursor:move}
.group.sel .g-body{stroke:var(--focus);stroke-opacity:1;stroke-width:2;stroke-dasharray:none}

.frame .f{fill:none;stroke:var(--nc);stroke-opacity:.45;stroke-width:2}
.frame .f-label{fill:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:22px;font-weight:700}
.frame .f-type rect{fill:none;stroke:var(--nc);stroke-opacity:.6}
.frame .f-type text{fill:var(--nc);font-size:12px;font-weight:700}
.frame .f-head{cursor:pointer}
.marq{fill:color-mix(in srgb,var(--focus) 10%,transparent);stroke:var(--focus);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.ghost-edge{stroke:var(--focus);stroke-width:2;fill:none;stroke-dasharray:6 4;pointer-events:none}

/* ---------- chrome ---------- */
.hud-top{position:absolute;top:14px;left:20px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;z-index:4}
.hud-top>*{pointer-events:auto}
.titleblock{max-width:min(560px,55vw);min-width:0}
.titleblock h1{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:clamp(22px,3vw,34px);line-height:1.08;letter-spacing:-.02em;margin:0;outline:none;border-radius:6px}
.titleblock p{margin:3px 0 0;color:var(--muted);font-size:15px;outline:none;border-radius:6px}
.editing .titleblock [contenteditable]:hover{background:var(--hover)}
.editing .titleblock [contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--focus)}
.titleblock p:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin-top:8px;font-size:14px}
.crumbs button{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;border-radius:6px;padding:2px 5px}
.crumbs button:hover{color:var(--ink);background:var(--hover)}
.crumbs .sep{color:var(--line)}
.crumbs [aria-current]{font-weight:700;color:var(--ink);padding:2px 5px}

.bar{background:var(--chrome);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px}
.topbar{display:flex;align-items:center;gap:2px;padding:4px;flex:none}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--hover);gap:2px}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{appearance:none;border:0;background:transparent;font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.dirty-dot{width:7px;height:7px;border-radius:50%;background:var(--focus)}
.ui-i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{appearance:none;border:0;background:transparent;width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.3;cursor:default}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 3px}

.palette{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,40px);gap:2px;padding:6px;z-index:4}
.palette button{appearance:none;border:0;background:transparent;width:40px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:grab;color:var(--ink);padding:0;touch-action:none}
.palette button:hover{background:var(--hover)}
.ps{fill:color-mix(in srgb,currentColor 7%,transparent);stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.palette .pal-h{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0 4px}
.palette .pal-hint{grid-column:1/-1;font-size:10.5px;line-height:1.3;color:var(--muted);text-align:center;padding:6px 2px 0;border-top:1px solid var(--line);margin-top:4px}
.drag-ghost{position:fixed;z-index:30;pointer-events:none;opacity:.85;color:var(--focus)}
.drag-ghost .ps{stroke:var(--focus)}

.levelbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;max-width:min(760px,calc(100% - 200px));z-index:4}
.levelbar .cap{margin:0;font-size:15.5px;line-height:1.4;padding:4px 2px}
.levelbar input.cap{border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:15px;min-width:220px;width:min(380px,40vw);padding:6px 8px;border-radius:8px}
.levelbar input.cap:hover{border-color:var(--line)}
.levelbar input.cap:focus{border-color:var(--focus);background:var(--surface);outline:none}
.type-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.legend{position:absolute;left:16px;bottom:18px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;font-size:13px;z-index:4}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:22px;height:12px;border-radius:999px;background:var(--rc)}
.legend .hint{color:var(--muted);font-size:12px}
.zoomctl{position:absolute;right:16px;bottom:18px;display:flex;flex-direction:column;gap:2px;padding:4px;z-index:4}

/* floating toolbar */
.ftb{position:absolute;z-index:12;display:flex;align-items:center;gap:1px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);white-space:nowrap}
.ftb .ib{width:32px;height:32px;border-radius:8px}
.ftb .tb-txt{appearance:none;border:0;background:transparent;height:32px;padding:0 9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ftb .tb-txt:hover{background:var(--hover)}
.ftb .tb-txt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ftb .tb-n{font-size:11px;background:var(--hover);border-radius:999px;padding:0 6px}.ftb .tb-txt[aria-pressed="true"] .tb-n{background:transparent}
.tag-pop .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tag-pop .pal-h{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 4px}
.tag-pop .chip{appearance:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;font:inherit;font-size:12px;font-weight:600;padding:2px 9px;cursor:pointer}
.tag-pop button.chip:hover{border-color:var(--focus)}
.tag-pop .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);cursor:default}
.tag-pop .chip.role-input{background:var(--in);border-color:var(--in);color:var(--surface)}.tag-pop .chip.role-output{background:var(--out);border-color:var(--out);color:var(--surface)}
.tag-pop .chip.on button{appearance:none;border:0;background:transparent;color:inherit;padding:0;display:grid;cursor:pointer;opacity:.8}
.tag-pop .m-url{display:flex;gap:6px}.tag-pop .m-url input{flex:1;margin:0;min-width:0}
.node .tag.more rect{opacity:.6}
.ftb .tb-danger{color:var(--danger)}
.swatch{width:16px;height:16px;border-radius:50%;background:var(--nc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:13;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);white-space:normal}
.pop.up{top:auto;bottom:calc(100% + 6px)}
.pop-grid{display:grid;gap:2px}
.pop-grid button{appearance:none;border:1px solid transparent;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.pop-grid button:hover{background:var(--hover)}
.pop-grid button[aria-pressed="true"]{border-color:var(--focus);background:var(--hover)}
.pop label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 10px}
.pop input,.pop textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;resize:vertical}
.pop textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.pop small{font-weight:400}
.pop .row{display:flex;gap:6px;flex-wrap:wrap}
.menu{display:grid;min-width:220px}
.menu button{appearance:none;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--muted);font-size:12px;font-weight:400}

/* detail card */
.card{position:absolute;z-index:11;width:320px;max-width:calc(100% - 24px);padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card h3{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:18px;line-height:1.2;margin:2px 0 4px}
.card .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--rc,var(--nc));color:var(--surface);margin-right:4px}
.card p{margin:10px 0 0;font-size:14.5px;line-height:1.55;white-space:pre-line}
.card .src{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.card .src code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 6px;overflow-wrap:anywhere}
.card .muted{color:var(--muted)}
.card .card-x{margin-left:auto}

.inline-edit{position:absolute;z-index:14;resize:none;border:2px solid var(--focus);border-radius:8px;background:var(--surface);color:var(--ink);text-align:center;font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;font-weight:600;padding:4px 6px;line-height:1.25;outline:none;overflow:hidden}

.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}
.toast .btn{color:var(--paper);padding:5px 10px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;padding:16px;z-index:25}
.dialog{background:var(--surface);color:var(--ink);border-radius:16px;max-width:680px;width:100%;max-height:90%;overflow:auto;padding:18px 20px 20px;box-shadow:var(--shadow)}
.dlg-head{display:flex;justify-content:space-between;align-items:center}
.dialog h2{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:22px;margin:0}
.dialog p{color:var(--muted);margin:6px 0 14px}
.dialog .btn{border:1px solid var(--line)}
.dialog .btn.solid{border-color:var(--ink)}
.dialog details{margin-top:16px}
.dialog summary{cursor:pointer;font-weight:600}
.dialog textarea{display:block;width:100%;height:280px;margin:10px 0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.dialog .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font-size:13px}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);font-size:16px;text-align:center;padding:24px}
.fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:4px 0 0}
.keys kbd{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}

@media (max-width:700px){
  .btn span{display:none}
  .btn{padding:8px 10px}
  .titleblock p{display:none}
  .legend{display:none}
  .levelbar{left:12px;right:64px;transform:none;max-width:none;bottom:14px}
  .zoomctl{right:12px;bottom:14px}
  .palette{top:auto;bottom:70px;left:8px;right:8px;transform:none;grid-template-columns:none;grid-auto-flow:column;overflow-x:auto}
  .palette .pal-h,.palette .pal-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .edge.flow .line{animation:none}
  #ss-scene,#ss-scene *{transition:none!important}
}

/* ---------- v0.3: navigation, hints, about, media, new level types ---------- */
.crumb-back{display:inline-grid!important;place-items:center;width:26px;height:26px;padding:0!important;margin-right:4px;border:1px solid var(--line)!important;border-radius:7px!important;color:var(--ink)!important}
.crumb-back:hover{background:var(--surface)!important}
.keys-inline{display:inline-flex;gap:10px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.keys-inline span{display:inline-flex;align-items:center;gap:5px}
.keys-inline .sw{width:14px;height:8px;border-radius:999px;background:var(--rc)}

<script type="application/json" id="story-data">{
 "meta": {
  "title": "Jetson_pkg Explained",
  "subtitle": "Every subsystem, routine and workflow in jetson_pkg, on the robot, the QNAP and the dev box",
  "summary": "How a buddy robot boots, runs lab workflows, shows its health, updates itself and reports to the QNAP, and how code gets from a pull request to every robot.",
  "intent": "learn",
  "audience": "bahead developers, new or experienced, who want to understand jetson_pkg end to end",
  "glossary": [
   {
    "term": "Series-0",
    "def": "The robot's Docker stack: Connector, Behaviour Tree Engine and Action Servers."
   },
   {
    "term": "Health flag",
    "def": "A small file a routine writes to report ok or problem."
   },
   {
    "term": "Checkpoint",
    "def": "Marker that lets firstboot skip stages already done."
   },
   {
    "term": "Line",
    "def": "Release family per JetPack: 2.x on JP6, 3.x on JP7."
   },
   {
    "term": "Fleet tree",
    "def": "QNAP folders holding releases, channels and per-robot overrides."
   },
   {
    "term": "Sync feature",
    "def": "A small module that applies one fleet-managed setting."
   },
   {
    "term": "Staged release",
    "def": "Downloaded and verified, waiting for someone to press Apply."
   },
   {
    "term": "Truth tree",
    "def": "The QNAP's record of what each line should contain."
   }
  ],
  "tours": [
   {
    "title": "Start here: power-on to fleet",
    "steps": [
     {
      "title": "One map for everything jetson_pkg does",
      "text": "Open any box to see what is inside. Inputs are on the left, outputs on the right. Hover traces data, / searches.",
      "notes": "Frame the map: three machines (dev box, QNAP, robot), the flasher, and the lab around the robot. Everything below is the code in the jetson_pkg repository."
     },
     {
      "path": [
       "robot"
      ],
      "title": "The robot",
      "text": "Boot, configuration, the Series-0 stack, health, the Service UI, updates and the fleet agent all live in one tree."
     },
     {
      "path": [
       "robot",
       "config",
       "loader"
      ],
      "title": "One loader for every script",
      "text": "Defaults first, then this robot's local.json, then generated files. Learn this once and every script reads the same."
     },
     {
      "path": [
       "robot",
       "lifecycle",
       "startup"
      ],
      "node": "ri",
      "title": "What happens at every boot",
      "text": "startup_script runs fixed stages and writes a health flag for each. Robot init powers the Cobotta and tells the network stage which port it is on."
     },
     {
      "path": [
       "robot",
       "boot"
      ],
      "node": "valid",
      "title": "Firstboot, once per robot",
      "text": "Checkpointed stages turn a flashed Jetson into a buddy robot. It refuses to reboot if validation fails."
     },
     {
      "path": [
       "robot",
       "lifecycle",
       "startup"
      ],
      "title": "Check yourself",
      "quiz": {
       "q": "Which stage tells the network stage which Ethernet port the Cobotta is on?",
       "answer": "ri",
       "explain": "Robot init pings the robot through each port and writes the port hint (or 'absent') that the network stage reads."
      }
     },
     {
      "path": [
       "robot",
       "net",
       "mon"
      ],
      "title": "Self-healing network",
      "text": "Every 30 seconds the monitor pings the robot and the hotspot. Only three failed runs in a row, outside a cooldown, restart NetworkManager."
     },
     {
      "path": [
       "robot",
       "stack"
      ],
      "node": "svc",
      "title": "The application: Series-0 stack",
      "text": "Lab commands come in over SiLA 2 and end up as arm, camera and GPU work, all in containers."
     },
     {
      "path": [
       "robot",
       "stack",
       "svc",
       "bt"
      ],
      "node": "par",
      "title": "Inside the Behaviour Tree Engine",
      "text": "After set-up, one branch mirrors the key_map into the Blackboard while the other turns flags into actions."
     },
     {
      "path": [
       "robot",
       "stack",
       "run"
      ],
      "title": "One workflow, end to end",
      "text": "A start command sets a flag, the tree sees it and drives the Action Servers; the result leaves as an ASTM record."
     },
     {
      "path": [
       "robot",
       "stack",
       "svc"
      ],
      "title": "Check yourself",
      "quiz": {
       "q": "Where does a SiLA 2 'start workflow' command land first after the Connector?",
       "answer": "wkm",
       "explain": "The Connector sets a key on the Workflow Key Manager; the tree polls it from there."
      }
     },
     {
      "path": [
       "robot",
       "obs"
      ],
      "node": "flags",
      "title": "Health flags: the robot's traffic lights",
      "text": "Any routine writes a tiny ok, warn or error file; the Service UI, the log processor and the Fleet UI all read the same folder."
     },
     {
      "path": [
       "robot",
       "sui"
      ],
      "node": "gate",
      "title": "The robot's own web app",
      "text": "Every buddy serves the Service UI by name. Hotspot users walk in; LAN users sign in with the hotspot password."
     },
     {
      "path": [
       "robot",
       "sui",
       "tabs"
      ],
      "node": "stack",
      "title": "Six tabs, one shell",

     },
     {
      "path": [
       "robot",
       "update"
      ],
      "node": "poll",
      "title": "Updates arrive by pull and wait for a person",
      "text": "The agent downloads and verifies its line's release on its own, but installing needs Apply in the Service UI or Fleet UI."

     {
      "path": [
       "robot",
       "update",
       "sync"
      ],
      "node": "pass",
      "title": "jetson-sync touches only what changed",
      "text": "Each feature module has a desired hash; a feature is re-applied only when its module, triggers or owned files changed, or its check finds it dirty."

     {
      "path": [
       "robot",
       "fleetagent"

      "node": "run",
      "title": "Commands run exactly once",

     {
      "path": [
       "qnap"
      ],
      "node": "fleettree",
      "title": "The fleet tree is the truth",
      "text": "Releases, channel pointers per line and each robot's desired state are plain files on the QNAP. CI writes releases; the Fleet UI writes channels and control."
     },
     {
      "path": [
       "qnap",
       "fleetui",
       "dapi"
      ],

/* ================= keyboard ================= */
function onKey(e){
  var t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
  if(viewing&&!$('#ss-viewer').hidden&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();stepMedia(e.key==='ArrowLeft'?-1:1);return;}
  if(tour&&!typing&&$('#ss-modal').hidden&&$('#ss-viewer').hidden&&!e.metaKey&&!e.ctrlKey){
    if(e.key==='ArrowRight'||e.key==='PageDown'||(presenting&&e.key===' ')){e.preventDefault();if(tour.i<tour.t.steps.length-1)stepTour(1);return;}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();stepTour(-1);return;}
  }
  if(e.key==='Escape'){
    if(infoOpen){infoOpen=false;renderInfo();renderHeader();return;}
    if(!$('#ss-viewer').hidden){closeMedia();return;}
    if(!$('#ss-search').hidden){closeSearch();return;}
    if(tour){endTour();return;}
    if(!$('#ss-modal').hidden){closeModal();return;}
    if(linkFrom){endLink();return;}
    if(typing){t.blur();return;}
    if(pop){pop=null;renderToolbar();return;}
    if(detailId){detailId=null;renderCard();return;}
    if(mode==='edit'&&hasSel()){setSel({});return;}
    if(path.length)goToPath(path.slice(0,-1));
    return;
  }
  if(typing||!$('#ss-modal').hidden)return;
  if(e.key===' '&&mode==='edit'){if(!spaceDown){spaceDown=true;document.body.classList.add('space');}e.preventDefault();return;}
  var mod=e.metaKey||e.ctrlKey,key=e.key.toLowerCase();
  if(mode==='edit'&&mod){
    if(key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(key==='y'){e.preventDefault();redo();return;}
    if(key==='d'){e.preventDefault();duplicate();return;}
    if(key==='c'){if(copySel())e.preventDefault();return;}
    if(key==='x'){if(copySel()){e.preventDefault();deleteSel();}return;}
    if(key==='v'){if(clipboard){e.preventDefault();paste(30);}return;}
    if(key==='a'){e.preventDefault();setSel({nodes:cur().nodes.map(function(n){return n.id;})});return;}
    if(key==='g'){e.preventDefault();e.shiftKey?ungroup():groupSel();return;}
    if(key==='e'){e.preventDefault();if(sel.nodes.length)nestNodes(sel.nodes.slice());return;}
    return;
  }
  if(mod||e.altKey)return;
  var nodeEl=t&&t.closest&&t.closest('.node');
  if(mode==='view'&&nodeEl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(nodeEl.dataset.id);return;}
  if(key==='e'){setMode(mode==='edit'?'view':'edit');return;}
  if(key==='f'){fitView();return;}
  if(mode==='view'&&e.key==='Backspace'&&path.length){e.preventDefault();goToPath(path.slice(0,-1));return;}
  if(key==='?'){openHelp();return;}
  if(e.key==='/'){e.preventDefault();openSearch();return;}
  if(mode==='view'&&key==='t'){openTours();return;}
  if(mode==='view'&&key==='p'){if(presenting)endTour();else startTour(0,true);return;}
  if(presenting&&key==='n'){openNotes();return;}
  if(mode!=='edit')return;
  if(e.key==='Delete'||e.key==='Backspace'){if(hasSel()){e.preventDefault();deleteSel();}return;}
  if(e.key==='Enter'){
    if(sel.nodes.length===1){e.preventDefault();startInline('node',sel.nodes[0]);}
    else if(sel.edge!=null){e.preventDefault();startInline('edge',sel.edge);}
    return;
  }
  if(e.key==='Tab'&&sel.nodes.length===1){e.preventDefault();addNext(sel.nodes[0]);return;}
  var arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(arrows[e.key]&&sel.nodes.length){
    e.preventDefault();var st=(e.shiftKey?10:1)*SNAP,v=arrows[e.key];
    commit(function(){sel.nodes.forEach(function(id){var n=findNode(id);if(n){n.x+=v[0]*st;n.y+=v[1]*st;}});});
  }
}

    if(depth){var pk=v.path.slice(0,-1).join('/');counts[pk]=(counts[pk]||0)+1;num=nums[pk]+'.'+counts[pk];}

    if(l.caption)out.push(l.caption,'');
    out.push('_Diagram type: '+TYPE_NAMES[t]+'._','');
    if(l.nodes.length){out.push('```mermaid',mermaidLevel(l),'```','');}
    var ins=l.nodes.filter(function(n){return n.role==='input';}),outs=l.nodes.filter(function(n){return n.role==='output';});
    if(ins.length)out.push('**Inputs:** '+ins.map(function(n){return mdc(n.label);}).join(', '),'');
    if(outs.length)out.push('**Outputs:** '+outs.map(function(n){return mdc(n.label);}).join(', '),'');

      ns.forEach(function(n){
        var sub=hasInner(n)?bySec[x.v.path.concat([n.id]).join('/')]:null;

        var ar=e.arrow||defArrow(l),op=ar==='both'?'\u2194':ar==='none'?'\u2014':'\u2192';
        out.push((t==='sequence'?(i+1)+'. ':'- ')+lab(e.from)+' '+op+' '+lab(e.to)+(e.label?': '+mdc(e.label):'')+(e.style==='dashed'&&t!=='sequence'?' _(optional or async)_':''));
      });

      var p=line.match(/^(?:participant|actor)\s+(\S+)(?:\s+as\s+(.+))?$/);if(p){var n=node(p[1],unq(p[2]||p[1]));if(/^actor/.test(line))n.shape='pill';return;}
      var msg=line.match(/^([^-\s>]+?)\s*(--?)(>>|>|x|\))\s*[+-]?([^:\s]+)\s*:\s*(.*)$/);
      if(msg){node(msg[1]);node(msg[4]);var e={from:msg[1],to:msg[4],label:unq(msg[5])};if(msg[2]==='--')e.style='dashed';lv.edges.push(e);}
    });
  }else if(/^stateDiagram/.test(head)){
    lv.type='state';var ini=null,fin=null;
    var st=function(t){t=t.trim();if(t==='[*]')return null;return node(t).id;};
    lines.slice(1).forEach(function(line){
      var d=line.match(/^state\s+"([^"]+)"\s+as\s+(\S+)/);if(d){node(d[2],d[1]);return;}
      var tr=line.match(/^(\S+)\s*-->\s*(\S+)(?:\s*:\s*(.*))?$/);if(!tr)return;
      var a=tr[1]==='[*]'?(ini=ini||node('start','','initial')).id:st(tr[1]),b=tr[2]==='[*]'?(fin=fin||node('done','Done','final')).id:st(tr[2]);
      var e={from:a,to:b};if(tr[3])e.label=unq(tr[3]);lv.edges.push(e);
    });
  }else if(/^classDiagram/.test(head)){
    lv.type='class';var open=null;
    var cls=function(id){var n=node(id);n.shape='class';return n;};
    var add=function(n,mem){mem=mem.trim();if(!mem)return;if(/^<<(.+)>>$/.test(mem)){n.stereotype=mem.slice(2,-2);return;}var k=/\(/.test(mem)?'methods':'fields';(n[k]=n[k]||[]).push(mem);};
    var OPS=[['<|--','inherits',true],['--|>','inherits',false],['<|..','implements',true],['..|>','implements',false],['*--','composition',false],['--*','composition',true],['o--','aggregation',false],['--o','aggregation',true],['-->','association',false],['<--','association',true],['..>','dependency',false],['<..','dependency',true],['--','association',false],['..','dependency',false]];
    lines.slice(1).forEach(function(line){
      if(open){if(line==='}'){open=null;return;}add(open,line);return;}
      var c=line.match(/^class\s+(\w+)(?:~\w+~)?\s*(\{)?\s*$/);if(c){var n=cls(c[1]);if(c[2])open=n;return;}
      var mb=line.match(/^(\w+)\s*:\s*(.+)$/);
      for(var i=0;i<OPS.length;i++){
        var op=OPS[i],at=line.indexOf(op[0]);if(at<0)continue;
        var left=line.slice(0,at).replace(/"[^"]*"/g,'').trim(),right=line.slice(at+op[0].length),lab=null,lm=right.match(/^(.*?):(.*)$/);if(lm){right=lm[1];lab=unq(lm[2]);}
        right=right.replace(/"[^"]*"/g,'').trim();if(!/^\w+$/.test(left)||!/^\w+$/.test(right))continue;
        cls(left);cls(right);
        var from=left,to=right;
        if(op[1]==='inherits'||op[1]==='implements'){if(op[2]){from=right;to=left;}}else if(op[2]){from=right;to=left;}
        var e={from:from,to:to,rel:op[1]};if(lab)e.label=lab;lv.edges.push(e);return;
      }
      if(mb)add(cls(mb[1]),mb[2]);
    });
  }else if(/^erDiagram/.test(head)){
    lv.type='data';var ent=null;
    var en=function(id){var n=node(id);n.shape='table';n.fields=n.fields||[];return n;};
    lines.slice(1).forEach(function(line){
      if(ent){if(line==='}'){ent=null;return;}var f=line.split(/\s+/);ent.fields.push(f[1]+': '+f[0]+(f[2]&&/PK|FK|UK/.test(f[2])?' '+f[2]:''));return;}
      var b=line.match(/^([\w-]+)\s*\{\s*$/);if(b){ent=en(b[1]);return;}
      var r=line.match(/^([\w-]+)\s+([|}o]{2})(--|\.\.)([|{o]{2})\s+([\w-]+)\s*:\s*(.+)$/);
      if(r){en(r[1]);en(r[5]);var many=/\{/.test(r[4])||/\}/.test(r[2]);lv.edges.push({from:r[1],to:r[5],label:unq(r[6])+(many?' (1..*)':'')});}
    });
  }else throw new Error('Unfold reads flowchart, graph, sequenceDiagram, stateDiagram, classDiagram and erDiagram. This text starts with \u201c'+head.slice(0,30)+'\u201d.');
  if(!lv.nodes.length)throw new Error('No nodes were found in that diagram.');
  return lv;
}
function importMermaid(){
  var ta=$('#ss-mm'),err=$('#ss-mm-err'),lv;
  try{lv=parseMermaid(ta.value);}catch(e){err.textContent=e.message;return;}
  var l=cur();
  if(l.nodes.length&&!confirm('Replace what is on this level with the imported diagram?'))return;
  commit(function(){var c=cur();var keep={caption:c.caption};Object.keys(c).forEach(function(k){delete c[k];});Object.assign(c,lv,keep);normLevel(c,{},!path.length);layoutAny(c);});
  closeModal();fitView(320);toast('Imported '+lv.nodes.length+' nodes and '+lv.edges.length+' links.');
}

/* ================= boot ================= */

    '<defs><marker id="ss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 1 10 5 0 9z"/></marker>'+
    '<marker id="ss-arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead sel" d="M0 1 10 5 0 9z"/></marker>'+relMarkers()+'</defs>'+
    '<g id="ss-scene"></g></svg><div class="empty-hint" id="ss-empty" hidden></div></div>'+
    '<header class="hud-top"><div class="titleblock"><h1 id="ss-title" spellcheck="false"></h1><p id="ss-subtitle" data-ph="Add a subtitle"></p><nav class="crumbs" id="ss-crumbs" aria-label="Where you are" hidden></nav></div><div class="topbar bar" id="ss-topbar"></div></header>'+
    '<div class="palette bar" id="ss-palette" hidden></div>'+
    
    '<div class="levelbar bar" id="ss-levelbar" hidden></div>'+
    '<div class="zoomctl bar"><button class="ib" data-act="zin" aria-label="Zoom in" title="Zoom in">'+uiIcon('plus')+'</button><button class="ib" data-act="zout" aria-label="Zoom out" title="Zoom out">'+uiIcon('minus')+'</button><button class="ib" data-act="fit" aria-label="Fit to screen" title="Fit (F)">'+uiIcon('fit')+'</button></div>'+
    '<div class="ftb" id="ss-ftb" role="toolbar" aria-label="Selection tools" hidden></div><div class="card" id="ss-card" hidden></div>'+
    '<div class="hint-tip" id="ss-hint" role="tooltip" hidden></div><aside class="about" id="ss-about" aria-label="About this diagram" hidden></aside><aside class="infopanel" id="ss-info" aria-label="Map info" hidden></aside>'+
    '<div class="viewer" id="ss-viewer" role="dialog" aria-modal="true" aria-label="Media" hidden></div><input type="file" id="ss-file" accept="image/*,video/*" hidden>'+
    '<div class="search" id="ss-search" role="dialog" aria-label="Search" hidden></div><section class="tourbar" id="ss-tour" aria-label="Tour" aria-live="polite" hidden></section>'+
    '<div class="toast" id="ss-toast" role="status" hidden></div><div class="modal" id="ss-modal" hidden></div>';
  svg=$('#ss-canvas');scene=$('#ss-scene');
  var raw=document.getElementById('story-data').textContent;
  try{data=normalize(JSON.parse(raw));}
  catch(err){app.innerHTML='<div class="fatal"><p>The diagram data could not be read: '+esc(err.message)+'</p></div>';return;}
  originalJSON=snapshot();draftKey='unfold:'+hash(originalJSON);
  var restored=false;
  try{var dr=localStorage.getItem(draftKey);if(dr&&dr!==originalJSON){data=normalize(JSON.parse(dr));restored=true;}}catch(e){}
  dirty=restored;
  svg.addEventListener('pointerdown',onDown);svg.addEventListener('pointermove',onMove);
  svg.addEventListener('pointerup',onUp);svg.addEventListener('pointercancel',onUp);
  svg.addEventListener('pointerleave',function(){if(mode==='view'&&!drag){setTrace(null);hideHint();}});
  svg.addEventListener('wheel',onWheel,{passive:false});
  svg.addEventListener('dblclick',onDbl);
  svg.addEventListener('contextmenu',function(e){if(mode==='edit')e.preventDefault();});
  $('#ss-file').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(f&&pendingMedia)attachFile(pendingMedia.id,f);pendingMedia=null;});
  function hasDrop(dt){var t=Array.from((dt&&dt.types)||[]);return t.indexOf('Files')>=0||t.indexOf('text/uri-list')>=0;}
  svg.addEventListener('dragover',function(e){if(mode==='edit'&&hasDrop(e.dataTransfer))e.preventDefault();});
  svg.addEventListener('drop',function(e){
    if(mode!=='edit')return;var dt=e.dataTransfer||{};
    var files=Array.from(dt.files||[]).filter(function(f){return /^(image|video)\//.test(f.type);});
    var url=!files.length&&dt.getData?String(dt.getData('text/uri-list')||'').split('\n').filter(function(x){return /^https?:\/\//.test(x.trim());})[0]:'';
    if(!files.length&&!url)return;e.preventDefault();var p=toWorld(e),on=nodeNear(p,null);
    // dropped on a node: the files belong to it; on empty canvas each becomes an image node
    if(files.length&&on&&on.shape!=='text'){setSel({nodes:[on.id]});files.forEach(function(f){attachFile(on.id,f);});toast('Attached '+files.length+' file'+(files.length>1?'s':'')+' to \u201c'+on.label+'\u201d.');return;}
    if(url){if(on&&on.shape!=='text'){commit(function(){setMedia(on,mediaList(on).concat([{src:url.trim()}]));});}else addUrlNode(url.trim(),p.x,p.y);return;}
    files.forEach(function(f,i){addMediaNode(f,p.x+i*40,p.y+i*40);});
  });
  // pasting a picture (a screenshot, say) puts it in the middle of the view
  document.addEventListener('paste',function(e){
    if(mode!=='edit'||busy)return;var t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
    var files=Array.from((e.clipboardData&&e.clipboardData.files)||[]).filter(function(f){return /^image\//.test(f.type);});
    if(!files.length)return;e.preventDefault();var c=viewCenter();
    files.forEach(function(f,i){var sp=freeSpot(cur(),'image',c.x+i*40,c.y+i*40);addMediaNode(f,sp.x,sp.y);});
  });
  window.addEventListener('popstate',function(e){var st=e.state&&e.state.unfold;if(!Array.isArray(st))st=[];if(busy)return;fromHistory=true;goToPath(st);});
  try{history.replaceState({unfold:[]},'');}catch(e){}
  $('#ss-palette').addEventListener('pointerdown',onPaletteDown);
  document.addEventListener('keydown',onKey);document.addEventListener('keyup',onKeyUp);
  document.addEventListener('click',onClick);
  var ftb=$('#ss-ftb');
  ftb.addEventListener('pointerdown',function(e){e.stopPropagation();});
  ftb.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ss-tagin'){e.preventDefault();addTagFromInput();}});
  ftb.addEventListener('input',function(e){var f=e.target.dataset&&e.target.dataset.field;if(f)updateField(f,e.target.value);});
  ftb.addEventListener('focusin',function(e){if(e.target.dataset&&e.target.dataset.field)fieldSnap=snapshot();});
  ftb.addEventListener('focusout',function(e){if(e.target.dataset&&e.target.dataset.field&&fieldSnap&&fieldSnap!==snapshot()){pushHistory(fieldSnap);renderHeader();}fieldSnap=null;});
  var lb=$('#ss-levelbar');
  lb.addEventListener('change',function(e){
    if(e.target.dataset.field!=='ltype')return;var v=e.target.value;
    commit(function(){var l=cur(),was=levelType(l);l.type=v;if(v==='sequence'||isTree(l)||v==='timeline'||was==='sequence'||was==='timeline'||was==='tree'||was==='behaviour'){delete l.direction;layoutAny(l);}});fitView(320);
  });
  lb.addEventListener('focusin',function(e){if(e.target.dataset&&e.target.dataset.field)fieldSnap=snapshot();});
  lb.addEventListener('input',function(e){if(e.target.dataset&&e.target.dataset.field)updateField(e.target.dataset.field,e.target.value);});
  lb.addEventListener('focusout',function(e){if(e.target.dataset&&e.target.dataset.field&&fieldSnap&&fieldSnap!==snapshot()){pushHistory(fieldSnap);renderHeader();}fieldSnap=null;});
  lb.addEventListener('keydown',function(e){if(e.key==='Enter')e.target.blur();});
  ['ss-title','ss-subtitle'].forEach(function(idv){
    var el=$('#'+idv),before=null;
    el.addEventListener('focus',function(){before=snapshot();});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur();}});
    el.addEventListener('blur',function(){
      var v=el.textContent.replace(/\s+/g,' ').trim();
      if(idv==='ss-title')data.meta.title=v||'Untitled system';else{if(v)data.meta.subtitle=v;else delete data.meta.subtitle;}
      if(before&&before!==snapshot()){pushHistory(before);markDirty();}
      renderHeader();
    });
  });
  var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(!busy)setCam(fitTo(viewTarget()));},120);});
  renderAll();renderAbout();
  var fit=fitTo(viewTarget());
  if(reduceMotion)setCam(fit);
  else{setCam(scaleBox(fit,1.25));scene.classList.add('arriving');requestAnimationFrame(function(){scene.classList.remove('arriving');animateCam(fit,900);});}
  if(restored)toast('Restored your unsaved edits from this browser.',{act:'discard-draft',label:'Discard'});
  else if(data.meta.intent==='demonstrate')toast('This map is set up as a presentation.',{act:'present',label:'Present'});
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(a){artifactCap=a;renderHeader();}).catch(function(){});
    window.claude.use('downloads').then(function(d){downloadsCap=d;}).catch(function(){});
  }
}
boot();
