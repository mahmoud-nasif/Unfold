name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "docs/**"]
  pull_request:
    paths-ignore: ["README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "docs/**"]

permissions:
  contents: read

# a new push to a pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    # ubuntu-latest (26.04) has no Python 3.9 builds; 24.04 still does
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "pytest>=7" "pyyaml>=6"
      - name: Validate example stories
        run: make check
      - name: Unit tests
        run: make test
      - name: Package the skill
        run: make package
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: unfold-skill
          path: dist/

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # Playwright's image ships Chromium and its system libraries (installing them took ~10 min);
    # keep the tag and the pip pin below on the same version
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest>=7" "pyyaml>=6" "pillow>=10" "pytest-xdist>=3" "playwright==1.64.1"
      - run: python -m pytest -m e2e -n auto

  install:
    name: Install channels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install.sh into a clean HOME
        run: |
          export HOME="$RUNNER_TEMP/home-sh" && mkdir -p "$HOME/.claude" "$HOME/.codex"
          sh install.sh --from . --dry-run
          sh install.sh --from .
          sh install.sh --from .   # idempotent
          python "$HOME/.claude/skills/unfold/scripts/unfold.py" check examples/unfold/diagram.json
          python "$HOME/.agents/skills/unfold/scripts/unfold.py" check examples/unfold/diagram.json
          test ! -e "$HOME/.claude/skills/unfold/evals"
          sh install.sh --uninstall
          test ! -e "$HOME/.claude/skills/unfold"
      - name: skills CLI (npx skills add) into a clean HOME
        run: |
          export HOME="$RUNNER_TEMP/home-npx" && mkdir -p "$HOME"
          npx -y skills@latest add "$GITHUB_WORKSPACE" -g -a claude-code -y
          python "$HOME/.claude/skills/unfold/scripts/unfold.py" check examples/unfold/diagram.json
      - name: Claude Code plugin manifests validate
        run: |
          export HOME="$RUNNER_TEMP/home-cc" && mkdir -p "$HOME"
          npx -y @anthropic-ai/claude-code@latest plugin validate .

  install-windows:
    name: Install channels (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.ps1 into the runner profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME\.claude" | Out-Null
          ./install.ps1 -From . -DryRun
          ./install.ps1 -From . -Agent claude-code,codex
          ./install.ps1 -From . -Agent claude-code,codex
          python "$HOME\.claude\skills\unfold\scripts\unfold.py" check examples/unfold/diagram.json
          python "$HOME\.agents\skills\unfold\scripts\unfold.py" check examples/unfold/diagram.json
          if (Test-Path "$HOME\.claude\skills\unfold\evals") { throw "evals were installed" }
          ./install.ps1 -Uninstall -Agent claude-code,codex
          if (Test-Path "$HOME\.claude\skills\unfold") { throw "uninstall left the skill behind" }

  wheel:
    name: Python package (unfold-map)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and run it on the example
        run: |
          python -m pip install dist/unfold_map-*.whl
          cd "$RUNNER_TEMP"
          unfold --version
          unfold check "$GITHUB_WORKSPACE/examples/unfold/diagram.json"
          unfold build "$GITHUB_WORKSPACE/examples/unfold/diagram.json" page.html
          unfold scan "$GITHUB_WORKSPACE" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: unfold-map-dist
          path: dist/
